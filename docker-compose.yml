services:
  postgres-flight:
    image: postgres:16
    container_name: flyingcaio-postgres-flight
    environment:
      POSTGRES_DB: flyingcaio_flight
      POSTGRES_USER: flyingcaio
      POSTGRES_PASSWORD: flyingcaio
    ports:
      - "5432:5432"
    volumes:
      - postgres_flight_data:/var/lib/postgresql/data

volumes:
  postgres_flight_data: